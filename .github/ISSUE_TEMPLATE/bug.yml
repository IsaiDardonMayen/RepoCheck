name: Error
description: Algo no funciona como debería.
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        No pegues secretos reales ni repos privados en este reporte.
        Si es una vulnerabilidad de seguridad, usa **Security → Report a vulnerability** en lugar de un issue público.
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Incluye la URL del repo público o una descripción del zip.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Navegador y versión
