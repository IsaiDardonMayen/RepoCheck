name: Historia de usuario
description: Una funcionalidad vista desde quien usa RepoCheck.
title: "[US-XX] "
labels: ["type:story"]
body:
  - type: textarea
    id: story
    attributes:
      label: Historia
      description: Formato «Como… quiero… para…».
      placeholder: Como persona que publica un repo, quiero… para…
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterio de aceptación
      description: Condiciones comprobables para darla por terminada.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Estimación (puntos)
      options: ["1", "2", "3", "5", "8"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notas técnicas
      description: Riesgos, dependencias y decisiones pendientes (opcional).
