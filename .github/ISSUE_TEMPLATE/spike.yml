name: Spike (investigación)
description: Una investigación acotada en tiempo para resolver una duda técnica.
title: "[Spike] "
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Pregunta que hay que responder
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Tiempo máximo
      placeholder: 1 día
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Resultado esperado
      description: Un documento en `docs/spikes/` y, si aplica, un ADR.
