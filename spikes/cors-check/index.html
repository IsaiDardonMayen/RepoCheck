<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Spike 001 · CORS de GitHub y OSV.dev</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  td, th { border-bottom: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
  .ok { color: #0a7d2c; } .fail { color: #b00020; }
</style>
</head>
<body>
<h1>Spike 001: acceso desde el navegador</h1>
<p>Ábrela desde un servidor estático (no <code>file://</code>) para que CORS aplique como en GitHub Pages.</p>
<button id="run">Ejecutar pruebas</button>
<table><thead><tr><th>Prueba</th><th>Resultado</th></tr></thead><tbody id="out"></tbody></table>
<script>
const tests = [
  ['GitHub: árbol del repo', () => fetch('https://api.github.com/repos/octocat/Hello-World/git/trees/master?recursive=1')],
  ['OSV: query', () => fetch('https://api.osv.dev/v1/query', { method: 'POST', body: JSON.stringify({ package: { name: 'lodash', ecosystem: 'npm' }, version: '4.17.15' }) })],
  ['OSV: querybatch', () => fetch('https://api.osv.dev/v1/querybatch', { method: 'POST', body: JSON.stringify({ queries: [{ package: { name: 'lodash', ecosystem: 'npm' }, version: '4.17.15' }] }) })],
  ['raw.githubusercontent.com', () => fetch('https://raw.githubusercontent.com/octocat/Hello-World/master/README')],
  ['GitHub: zipball (se espera fallo)', () => fetch('https://api.github.com/repos/octocat/Hello-World/zipball/master')],
];
document.getElementById('run').onclick = async () => {
  const out = document.getElementById('out');
  out.textContent = '';
  for (const [name, fn] of tests) {
    const tr = document.createElement('tr');
    const a = document.createElement('td'); a.textContent = name;
    const b = document.createElement('td');
    try { const r = await fn(); b.textContent = 'HTTP ' + r.status; b.className = r.ok ? 'ok' : 'fail'; }
    catch (e) { b.textContent = 'Falló: ' + e.message; b.className = 'fail'; }
    tr.append(a, b); out.append(tr);
  }
};
</script>
</body>
</html>
